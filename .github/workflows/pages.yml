name: Validate and deploy GitHub Pages

"on":
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HAUSBAR_CI_VENV: ${{ runner.temp }}/hausbar-ci-venv
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".python-version"
          architecture: "x64"

      - name: Set up exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Verify repository root
        run: python tools/check_repository_root.py

      - name: Build locked offline Python environment
        run: python tools/bootstrap_clean_environment.py --venv "$HAUSBAR_CI_VENV" --replace

      - name: Verify CI toolchain and pinned workflow
        run: |
          "$HAUSBAR_CI_VENV/bin/python" tools/check_ci_environment.py

      - name: Build deterministic public site
        run: |
          "$HAUSBAR_CI_VENV/bin/python" tools/build.py --site site

      - name: Run existing Phase-1 regression and privacy tests
        run: |
          "$HAUSBAR_CI_VENV/bin/python" -m unittest discover -s tests -v

      - name: Run existing JavaScript runtime and offline contract tests
        run: node tests/runtime_contract.mjs

      - name: Enforce byte-identical public site
        run: |
          "$HAUSBAR_CI_VENV/bin/python" tools/verify_public_tree.py --site site

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
          retention-days: 1

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
